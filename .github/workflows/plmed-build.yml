name: PL-Med Bramka SMS - build

# Dwa tryby:
#  - push taga v<wersja>-plmed.<n>  -> podpisany APK release + GitHub Release
#  - workflow_dispatch               -> build kontrolny (debug bez secretow, release jesli secrety sa)

on:
  push:
    tags:
      - "v*-plmed*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLAVOR: local        # smak PL-Med: tylko serwer lokalny
  APP_FILE_NAME: PL-Med-Bramka-SMS

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle (cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Wersja aplikacji
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          # versionCode = MINUTY od 2022-06-15 00:00 UTC (PL-Med W7; wczesniej dni od 2022-06-15 jak upstream).
          # Dni dawaly ten sam kod wydaniom z jednego dnia (plmed.5 i plmed.6). Minuty: rosna monotonicznie,
          # sa unikalne (wydanie = tag pchany recznie, nie dwa w jednej minucie), sa wieksze od dotychczasowych
          # kodow (~1592 przy plmed.7 -> aktualizacja w miejscu dziala) i mieszcza sie w limicie Androida
          # 2 100 000 000 (wystarczy na ok. 3990 lat).
          VERSION_CODE=$(( ($(date -u +%s) - $(date -u -d "2022-06-15T00:00:00Z" +%s)) / 60 ))
          if (( VERSION_CODE <= 1592 || VERSION_CODE > 2100000000 )); then
            echo "::error::versionCode ${VERSION_CODE} poza zakresem (1593..2100000000) - sprawdz zegar runnera"
            exit 1
          fi
          sed -i "s/versionName.*/versionName \"${VERSION_NAME}\"/" app/build.gradle
          sed -i "s/versionCode.*/versionCode ${VERSION_CODE}/" app/build.gradle
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"

      - name: Czy sa secrety podpisu
        id: sign
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${KS}" ]]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Blokada - tag bez secretow
        if: github.ref_type == 'tag' && steps.sign.outputs.enabled != 'true'
        run: |
          echo "::error::Tag release wymaga secretow KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
          exit 1

      - name: Testy jednostkowe
        run: |
          set -o pipefail
          ./gradlew --no-daemon testLocalReleaseUnitTest 2>&1 | tee build.log || {
            # bledy jako adnotacje GitHub (widoczne przez API, bez pobierania logow)
            grep -E '^e: |error:|FAILED|What went wrong|Caused by' build.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

      - name: Keystore
        if: steps.sign.outputs.enabled == 'true'
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "${KS}" | base64 -d > app/keystore.jks

      - name: Build release (podpisany)
        if: steps.sign.outputs.enabled == 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleLocalRelease 2>&1 | tee build.log || {
            grep -E '^e: |error:|FAILED|What went wrong|Caused by' build.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
          mkdir -p out
          cp app/build/outputs/apk/local/release/app-local-release.apk \
             "out/${APP_FILE_NAME}-${{ steps.ver.outputs.name }}.apk"

      - name: Build debug (kontrolny, bez podpisu release)
        if: steps.sign.outputs.enabled != 'true'
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleLocalDebug 2>&1 | tee build.log || {
            grep -E '^e: |error:|FAILED|What went wrong|Caused by' build.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
          mkdir -p out
          cp app/build/outputs/apk/local/debug/app-local-debug.apk \
             "out/${APP_FILE_NAME}-${{ steps.ver.outputs.name }}-debug.apk"

      - name: Suma kontrolna
        run: |
          cd out && sha256sum *.apk | tee SHA256SUMS.txt

      - name: Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_FILE_NAME }}-${{ steps.ver.outputs.name }}
          path: out/*
          retention-days: 30

      - name: Usun keystore z runnera
        if: always()
        run: rm -f app/keystore.jks

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: PL-Med Bramka SMS ${{ steps.ver.outputs.name }}
          files: |
            out/*.apk
            out/SHA256SUMS.txt
          body: |
            ## PL-Med Bramka SMS ${{ steps.ver.outputs.name }}

            Aplikacja na telefon z Androidem (min. Android 5.0), ktora dziala jako bramka SMS
            dla systemu PL-Med w sieci lokalnej kliniki. Wersja bez trybu chmury.

            ### Instalacja
            1. Pobierz plik `${{ env.APP_FILE_NAME }}-${{ steps.ver.outputs.name }}.apk` na telefon
               albo zeskanuj kod QR w PL-Med (modul Bramka SMS).
            2. Otworz plik i zezwol na instalacje z tego zrodla (jednorazowo).
            3. Uruchom aplikacje i nadaj uprawnienia do SMS.
            4. W PL-Med otworz modul Bramka SMS -> Polacz telefon i zeskanuj kod QR telefonem
               (Start -> Polacz z PL-Med albo Ustawienia -> Polacz z PL-Med...).

            Jesli na telefonie jest zainstalowana oryginalna aplikacja SMSGate (capcom6),
            odinstaluj ja - obie moga dzialac rownolegle, ale PL-Med ma laczyc sie z jedna.

            `versionCode` = ${{ steps.ver.outputs.code }}. Fork projektu
            [capcom6/android-sms-gateway](https://github.com/capcom6/android-sms-gateway) (Apache 2.0).
